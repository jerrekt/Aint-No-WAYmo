; Build the XIAO ESP32-C3 by default. For a generic C3, use:
; pio run -e esp32c3_devkitm -t upload
[platformio]
default_envs = xiao_esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.0
build_flags =
    -DWAYMO_BENCH_ONLY=1

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3

[env:esp32c3_devkitm]
board = esp32-c3-devkitm-1
