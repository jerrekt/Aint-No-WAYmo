; Roof turret bench test: 2 g servo on D8 and TF-Luna on I2C (D4/D5), XIAO ESP32-S3 Sense.
; Build and flash:  pio run -d bench/turret-s3 -t upload
; Watch output:     pio device monitor -d bench/turret-s3
[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
build_flags =
    -DWAYMO_BENCH_ONLY=1
    -DARDUINO_USB_CDC_ON_BOOT=1
